    function card(pos, i) {
      var id = t.lineup[pos][i], p = t.players.filter(function (x) { return x.id === id; })[0];
      var swap = selP && selP.pos === pos && selP.id !== id && !selP.injury && t.lineup[pos].indexOf(selP.id) < 0;
      return p ? playerCard(p, { slot: pos + ':' + i, swap: swap }) : '';
    }
    var benchPlayers = t.players.filter(function (p) { return t.lineup[p.pos].indexOf(p.id) < 0; }).sort(function (a, b) { return M.POS_LIST.indexOf(a.pos) - M.POS_LIST.indexOf(b.pos) || M.ov(b) - M.ov(a); });
    var bench = benchPlayers.map(function (p) {
      var swap = selP && selP.pos === p.pos && t.lineup[p.pos].indexOf(selP.id) >= 0 && !p.injury;
      return playerCard(p, { small: true, swap: swap });
    }).join('');
    return '<div class="squad"><section class="board-wrap"><div class="sq-head"><h2>선발 일곱 명</h2><div class="sq-meta"><span>전력 <b>' + M.strength(t) + '</b></span><span>호흡 <b>' + t.chemistry + '</b></span><span>사기 <b>' + t.morale + '</b></span></div></div>' +
      '<p class="lead">카드를 누르면 능력치가 나오고, 같은 포지션 선발과 후보끼리 자리를 바꿀 수 있습니다.</p><div class="board"><div class="b-row">' + card('seeker', 0) + '</div><div class="b-row">' + card('chaser', 0) + card('chaser', 1) + card('chaser', 2) + '</div><div class="b-row">' + card('beater', 0) + card('beater', 1) + '</div><div class="b-row">' + card('keeper', 0) + '</div></div>' +
      '<div class="bench"><h3>후보 ' + benchPlayers.length + '명</h3><div class="b-strip">' + (bench || '<p>후보가 없습니다. 이적 시장에서 영입하세요.</p>') + '</div></div></section>' + detailPanel(t) + '</div>';
  }

  // ---------- 훈련 ----------
  function viewTrain() {
    var tr = st.training, t = M.my(st);
    var young = t.players.filter(function (p) { return p.age <= 25 && p.pot > M.ov(p); }).sort(function (a, b) { return a.age - b.age; });
    return '<section class="panel"><div class="head"><h2>이번 주 훈련</h2><small>경기 후 적용됩니다</small></div>' +
      '<p class="lead">집중 능력을 하나 고르면 성장이 그쪽으로 쏠립니다. 어릴수록 많이 늘고, 30세가 넘으면 거의 늘지 않습니다.</p>' +
      '<div class="field"><span>집중 능력</span><div class="seg wrapped">' + M.ATTRS.map(function (k) { return '<button type="button" data-act="focus" data-v="' + k + '" class="' + (tr.focus === k ? 'on' : '') + '">' + M.ATTR_NAME[k] + '</button>'; }).join('') + '</div></div>' +
      '<div class="field"><span>강도</span><div class="seg">' + M.INTENSITY.map(function (x, i) { return '<button type="button" data-act="intensity" data-v="' + i + '" class="' + (tr.intensity === i ? 'on' : '') + '">' + x.name + '</button>'; }).join('') + '</div></div>' +
      '<p class="tip">' + ['성장은 느리지만 피로가 쌓이지 않습니다. 빡빡한 일정이나 중요한 경기 전에 좋습니다.', '성장과 피로의 균형을 맞춘 기본 강도입니다.', '빨리 늘지만 피로가 많이 쌓이고 훈련 중 부상 위험이 있습니다.'][tr.intensity] + '</p></section>' +
      '<section class="panel"><div class="head"><h2>성장 중인 선수</h2><small>잠재력은 추정치입니다</small></div>' +
      (young.length ? '<div class="scroll"><table class="t"><tr><th class="left">이름</th><th class="left">포지션</th><th>나이</th><th>종합</th><th>잠재</th><th class="left">다음 성장까지</th></tr>' + young.map(function (p) {
        return '<tr><td class="left">' + p.name + '</td><td class="left">' + S.POS_NAME[p.pos] + '</td><td>' + p.age + '</td><td><b>' + M.ov(p) + '</b></td><td>' + potLabel(p) + '</td><td class="left">' + bar(p.xp, 1, 'violet') + '</td></tr>';
      }).join('') + '</table></div>' : '<p class="note">지금은 크게 성장할 선수가 없습니다. 이적 시장에서 어린 선수를 찾아보세요.</p>') + '</section>';
  }

  // ---------- 리그 ----------
  function viewLeague() {
    var recent = st.results.slice(-4).reverse();
    return '<section class="panel"><div class="head"><h2>시즌 ' + st.season + ' 순위</h2><small>승 3점 · 무 1점 · 상위 4팀 플레이오프</small></div>' + tableHtml(false) + '</section>' +
      (st.playoff ? '<section class="panel"><div class="head"><h2>플레이오프</h2></div>' + bracket() + '</section>' : '') +
      '<section class="panel"><div class="head"><h2>최근 결과</h2></div>' + (recent.length ? '<ul class="news">' + recent.map(function (r) { return '<li>' + chip(r.h) + tname(r.h) + ' <b>' + r.sh + ' : ' + r.sa + '</b> ' + chip(r.a) + tname(r.a) + '</li>'; }).join('') + '</ul>' : '<p class="note">아직 치른 경기가 없습니다.</p>') + '</section>' +
      '<section class="panel"><div class="head"><h2>구단 전력</h2></div><div class="scroll"><table class="t"><tr><th class="left">구단</th><th>전력</th>' + M.POS_LIST.map(function (p) { return '<th>' + S.POS_NAME[p] + '</th>'; }).join('') + '</tr>' +
      st.teams.map(function (t, i) { return { t: t, i: i }; }).sort(function (a, b) { return M.strength(b.t) - M.strength(a.t); }).map(function (x) {
        return '<tr class="' + (x.i === st.myTeam ? 'mine' : '') + '"><td class="left">' + chip(x.i) + x.t.name + '</td><td><b>' + M.strength(x.t) + '</b></td>' + M.POS_LIST.map(function (p) { return '<td>' + M.posStrength(x.t, p) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</table></div></section>';
  }

  // ---------- 이적 ----------
  function viewMarket() {
    var open = M.transferOpen(st), t = M.my(st);
    var status = open ? (st.phase === 'offseason' ? '비시즌 이적 시장이 열려 있습니다.' : '시즌 중간 이적 시장이 이번 주에만 열려 있습니다.') : '이적 시장이 닫혀 있습니다. 8라운드 경기 전과 시즌이 끝난 뒤에 열립니다.';
    var list = open ? st.market.map(function (e) { return { e: e, f: M.findPlayer(st, e.id) }; }).filter(function (x) { return x.f && (marketFilter === 'all' || x.f.p.pos === marketFilter); }) : [];
    var rows = list.map(function (x) {
      var p = x.f.p, price = x.e.price, afford = st.budget >= price;
      var btn = pendingBuy === p.id ? '<button class="btn primary small" type="button" data-act="buyYes" data-id="' + p.id + '">' + money(price) + ' 지불 확정</button>' : '<button class="btn small" type="button" data-act="buy" data-id="' + p.id + '"' + (afford ? '' : ' disabled') + '>영입</button>';
      return '<tr><td class="left">' + M.fullName(p) + '</td><td class="left">' + S.POS_NAME[p.pos] + '</td><td>' + p.age + '</td><td><b>' + M.ov(p) + '</b></td><td>' + potLabel(p) + '</td><td class="left">' + (x.e.from < 0 ? '자유 계약' : tname(x.e.from)) + '</td><td>' + M.wage(p) + '</td><td><b>' + money(price) + '</b></td><td>' + btn + '</td></tr>';
    }).join('');
    var mineRows = t.players.slice().sort(function (a, b) { return M.POS_LIST.indexOf(a.pos) - M.POS_LIST.indexOf(b.pos) || M.ov(b) - M.ov(a); }).map(function (p) {
      var can = M.canSell(st, p), price = M.sellPrice(p);
      var btn = !open ? '' : pendingSell === p.id ? '<button class="btn primary small" type="button" data-act="sellYes" data-id="' + p.id + '">' + money(price) + '에 판매 확정</button>' : '<button class="btn small" type="button" data-act="sell" data-id="' + p.id + '"' + (can ? '' : ' disabled') + '>판매</button>';
      return '<tr><td class="left">' + M.fullName(p) + '</td><td class="left">' + S.POS_NAME[p.pos] + '</td><td>' + p.age + '</td><td><b>' + M.ov(p) + '</b></td><td>' + p.contract + '년</td><td>' + M.wage(p) + '</td><td>' + money(price) + '</td><td>' + btn + '</td></tr>';
    }).join('');
    var filter = '<div class="seg wrapped small-seg">' + [['all', '전체']].concat(M.POS_LIST.map(function (p) { return [p, S.POS_NAME[p]]; })).map(function (o) { return '<button type="button" data-act="filter" data-v="' + o[0] + '" class="' + (marketFilter === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>';
    return '<section class="panel"><div class="head"><h2>이적 시장</h2><small>예산 ' + money(st.budget) + '금화 · 선수단 ' + t.players.length + ' / ' + M.MAX_SQUAD + '명</small></div><p class="lead">' + status + ' 종합은 지금 실력, 잠재는 앞으로 오를 수 있는 추정치입니다.</p>' +
      (open ? filter + (rows ? '<div class="scroll"><table class="t"><tr><th class="left">이름</th><th class="left">포지션</th><th>나이</th><th>종합</th><th>잠재</th><th class="left">소속</th><th>주급</th><th>이적료</th><th></th></tr>' + rows + '</table></div>' : '<p class="note">이 포지션의 매물이 없습니다.</p>') : '') + '</section>' +
      '<section class="panel"><div class="head"><h2>우리 선수</h2><small>이적료의 기준은 나이와 능력입니다</small></div><div class="scroll"><table class="t"><tr><th class="left">이름</th><th class="left">포지션</th><th>나이</th><th>종합</th><th>계약</th><th>주급</th><th>판매가</th><th></th></tr>' + mineRows + '</table></div></section>';
  }

  // ---------- 재정 ----------
  function viewFinance() {
    var wages = M.weeklyWage(st), r = st.records;
    return '<div class="grid"><div class="col"><section class="panel"><div class="head"><h2>재정</h2></div>' +
      '<div class="tiles"><div><span>예산</span><b class="' + (st.budget < 0 ? 'neg' : '') + '">' + money(st.budget) + '</b></div><div><span>주급 총액</span><b>' + money(wages) + '</b></div><div><span>인기</span><b>' + Math.round(st.rep) + '</b></div><div><span>구단주 신뢰</span><b>' + Math.round(st.trust) + '</b></div></div>' +
      (st.budget < 0 ? '<p class="alert">예산이 적자입니다. 이적 시장이 열리면 선수를 팔아 메우세요.</p>' : '') +
      '<p class="note">수입은 스폰서, 홈 경기 입장 수입, 승리 수당, 시즌 상금에서 나옵니다. 인기는 좋은 성적을 내면 오릅니다.</p></section>' +
      '<section class="panel"><div class="head"><h2>최근 거래</h2></div><div class="scroll"><table class="t"><tr><th class="left">시기</th><th class="left">내용</th><th>금액</th></tr>' +
      st.ledger.slice(0, 16).map(function (l) { return '<tr><td class="left">S' + l.s + ' · ' + l.r + 'R</td><td class="left">' + l.label + '</td><td class="' + (l.amount < 0 ? 'neg' : 'pos') + '">' + (l.amount > 0 ? '+' : '') + money(l.amount) + '</td></tr>'; }).join('') + '</table></div></section></div>' +
      '<div class="col"><section class="panel"><div class="head"><h2>구단 역사</h2></div><div class="tiles two"><div><span>우승</span><b>' + r.titles + '</b></div><div><span>최고 순위</span><b>' + (r.bestRank > 8 ? '—' : r.bestRank + '위') + '</b></div></div>' +
      (st.history.length ? '<div class="scroll"><table class="t"><tr><th>시즌</th><th>순위</th><th>승점</th><th class="left">우승 구단</th><th class="left">목표</th><th class="left">최고 선수</th></tr>' + st.history.slice(0, 12).map(function (h) {
        return '<tr><td>' + h.season + '</td><td>' + h.rank + '위</td><td>' + h.pts + '</td><td class="left">' + tname(h.champion) + '</td><td class="left">' + (h.met ? '달성' : '실패') + '</td><td class="left">' + h.top + '</td></tr>';
      }).join('') + '</table></div>' : '<p class="note">첫 시즌을 마치면 기록이 쌓입니다.</p>') + '</section>' +
      '<section class="panel"><div class="head"><h2>소리</h2></div><div class="checks"><label><input type="checkbox" id="prefSfx"' + (window.GameAudio && window.GameAudio.pref().sfx ? ' checked' : '') + '>효과음</label><label><input type="checkbox" id="prefBgm"' + (window.GameAudio && window.GameAudio.pref().bgm ? ' checked' : '') + '>배경음</label></div></section>' +
      '<section class="panel"><div class="head"><h2>저장</h2><small id="saveState">' + saveState + '</small></div><p class="note">진행 상황은 자동으로 저장됩니다.</p>' +
      (cloud.ok ? (cloud.user ? '<p class="note">' + (cloud.user.displayName || '구글 계정') + '로 로그인되어 기기 간 연동 중입니다.</p><button class="btn" type="button" data-act="logout">로그아웃</button>' : '<button class="btn primary" type="button" data-act="login">구글로 로그인해 기기 연동</button>') : '') +
      '<div class="cta"><button class="btn" type="button" data-act="exportSave">기록 내보내기</button><button class="btn" type="button" data-act="importSave">기록 불러오기</button></div>' +
      (pendingExport ? '<textarea class="save-code" id="saveCode" readonly aria-label="내보낸 기록">' + JSON.stringify(st).replace(/</g, '&lt;') + '</textarea><div class="cta"><button class="btn primary" type="button" data-act="copySave">복사</button></div>' : '') +
      (pendingImport ? '<textarea class="save-code" id="importCode" aria-label="불러올 기록" placeholder="내보낸 기록을 붙여 넣으세요"></textarea><p class="note" id="importMsg">지금 기록은 지워지고 붙여 넣은 기록으로 바뀝니다.</p><div class="cta"><button class="btn danger" type="button" data-act="importYes">이 기록으로 바꾸기</button></div>' : '') +
      (pendingReset ? '<div class="cta"><button class="btn danger" type="button" data-act="resetYes">구단을 지우고 새로 시작</button><button class="btn" type="button" data-act="resetNo">취소</button></div>' : '<button class="btn" type="button" data-act="reset">새 게임 시작</button>') + '</section></div></div>';
  }

  // ---------- 경기 결과 ----------
  function viewReport() {
    var r = report || st.lastReport;
    if (!r) { view = 'home'; return viewHome(); }
    var won = r.winner === r.myside, draw = r.winner === null;
    var head = draw ? '무승부' : won ? '승리' : '패배';
    var mine = r.ratings.filter(function (x) { return x.side === r.myside; }).sort(function (a, b) { return b.rating - a.rating; });
    var ratingRows = mine.map(function (x) {
      return '<tr><td class="left">' + x.name + '</td><td class="left">' + x.posName + '</td><td><b>' + x.rating.toFixed(1) + '</b></td><td>' + x.goals + '</td><td>' + x.assists + '</td><td>' + x.tackles + '</td><td>' + x.saves + '</td><td>' + x.hits + '</td><td>' + x.catches + '</td></tr>';
    }).join('');
    var rankLine = r.rankAfter ? r.rankBefore + '위 → ' + r.rankAfter + '위' : (r.playoffStage === 'final' ? '결승' : '4강');
    return '<section class="panel report"><small>' + (r.stage === 'regular' ? (r.round + 1) + '라운드' : r.playoffStage === 'semi' ? '플레이오프 4강' : '플레이오프 결승') + ' · ' + r.weather + ' · ' + S.mmss(r.duration) + '</small><h2 class="slam ' + (won ? 'pos' : draw ? '' : 'neg') + '">' + head + '</h2>' +
      '<div class="final">' + chip(r.h) + tname(r.h) + ' <b><span data-count="' + r.score[0] + '">0</span> : <span data-count="' + r.score[1] + '">0</span></b> ' + chip(r.a) + tname(r.a) + '</div>' +
      '<div class="tiles"><div><span>순위</span><b class="sm">' + rankLine + '</b></div><div><span>이번 주 수지</span><b class="sm ' + (r.money < 0 ? 'neg' : 'pos') + '" data-money="' + r.money + '">0</b></div><div><span>스니치</span><b class="sm">' + (r.snitchBy === null ? '없음' : r.snitchBy === r.myside ? '우리 팀 포획' : '상대 포획') + '</b></div><div><span>예산</span><b class="sm">' + money(st.budget) + '</b></div></div>' +
      (r.growth && r.growth.length ? '<div class="grows">' + r.growth.map(function (g) { return '<span class="grow">' + g + '</span>'; }).join('') + '</div>' : '') +
      (r.injuries.length ? '<p class="alert">부상: ' + r.injuries.join(', ') + '</p>' : '') +
      (r.analysis || analysisRun === r ? '<section class="analysis" id="analysis">' + (r.analysis ? analysisHtml(r.analysis) : '<p class="ana-wait">모의 경기로 승패 원인을 분석하는 중입니다</p><span class="ana-track"><i id="anaBar"></i></span>') + '</section>' : '') +
      '<h3 class="rate-head">선수 평점</h3><div class="scroll"><table class="t"><tr><th class="left">선수</th><th class="left">포지션</th><th>평점</th><th>골</th><th>도움</th><th>태클</th><th>선방</th><th>블러저</th><th>포획</th></tr>' + ratingRows + '</table></div>' +
      '<div class="cta"><button class="btn primary big" type="button" data-act="afterReport">' + (st.phase === 'offseason' ? '시즌 정리로' : '다음 주 준비') + '</button></div></section>';
  }

  // ---------- 비시즌 ----------
  function viewOffseason() {
    var o = st.offseason, t = M.my(st);
    var exp = (o.expiring || []).map(function (id) { return t.players.filter(function (p) { return p.id === id; })[0]; }).filter(Boolean);
    var missing = M.POS_LIST.filter(function (pos) { return M.byPos(t, pos).filter(function (p) { return exp.indexOf(p) < 0; }).length < M.SLOTS[pos]; });
    return '<section class="panel report"><small>시즌 ' + st.season + ' 결과</small><h2>' + (o.champ ? '우승!' : '정규 리그 ' + o.rank + '위') + '</h2>' +
      '<p class="lead">우승: ' + chip(o.champion) + tname(o.champion) + ' · 구단주 목표 "' + o.goal + '" ' + (o.met ? '달성 (보너스 120금화)' : '실패') + ' · 상금 ' + money(o.prize) + '금화 · 신뢰 ' + Math.round(st.trust) + '</p>' + bracket() + '</section>' +
      '<div class="grid"><div class="col"><section class="panel"><div class="head"><h2>계약 만료</h2><small>재계약하지 않으면 떠나고, 라이벌 구단으로 갈 수 있습니다</small></div>' +
      (exp.length ? '<div class="scroll"><table class="t"><tr><th class="left">이름</th><th class="left">포지션</th><th>나이</th><th>종합</th><th>주급</th><th>재계약비</th><th></th></tr>' + exp.map(function (p) {
        var c = M.renewCost(p);
        return '<tr><td class="left">' + p.name + '</td><td class="left">' + S.POS_NAME[p.pos] + '</td><td>' + p.age + '</td><td><b>' + M.ov(p) + '</b></td><td>' + M.wage(p) + '</td><td>' + money(c) + '</td><td><button class="btn small" type="button" data-act="renew" data-id="' + p.id + '"' + (st.budget >= c ? '' : ' disabled') + '>2년 재계약</button></td></tr>';
      }).join('') + '</table></div>' : '<p class="note">계약이 끝나는 선수가 없습니다.</p>') +
      (missing.length ? '<p class="alert">' + missing.map(function (p) { return S.POS_NAME[p]; }).join(', ') + ' 인원이 부족합니다. 비워 두면 약한 임시 선수가 들어옵니다.</p>' : '') + '</section></div>' +
      '<div class="col"><section class="panel"><div class="head"><h2>선수단 변화</h2></div>' + (o.retired.length ? '<p class="note">은퇴: ' + o.retired.join(', ') + '</p>' : '<p class="note">은퇴 선수가 없습니다.</p>') + '<p class="note">새로운 신인 ' + o.rookies + '명이 자유 계약 시장에 나왔습니다.</p><div class="cta"><button class="btn" type="button" data-act="nav" data-to="market">이적 시장 보기</button></div></section></div></div>' +
      '<div class="cta end"><button class="btn primary big" type="button" data-act="nextSeason">시즌 ' + (st.season + 1) + ' 시작</button></div>';
  }

  // ---------- 동작 ----------
  function closeMatch() { prepOpen = false; window.scrollTo(0, 0); }
  function applyMatch(m) {
    var actx = M.analysisContext(st);
    report = M.finishMatch(st, m);
    analysisRun = report;
    view = 'report';
    enter = true;
    persist();
    closeMatch();
    render();
    animateReport();
    runAnalysis(actx, m, report);
  }
  // 분석은 화면이 멈추지 않도록 잘게 나눠 계산한다.
  function runAnalysis(actx, m, rep) {
    var A = window.QuidditchAnalysis;
    if (!A) return;
    var state = A.start(actx, m);
    analysisRun = rep;
    window.__lastAnalysis = state;
    (function tick() {
      if (analysisRun !== rep) return; // 결과 화면을 떠나면 계산을 멈춰 경기와 화면이 느려지지 않게 한다.
      var done = A.step(state, 14);
      var bar = document.getElementById('anaBar');
      if (bar) bar.style.width = Math.round(A.progress(state) * 100) + '%';
      if (!done) { setTimeout(tick, 16); return; }
      rep.analysis = state.result;
      analysisRun = null;
      if (st.lastReport === rep) persist();
      var box = document.getElementById('analysis');
      if (box && report === rep) { box.innerHTML = analysisHtml(rep.analysis); box.classList.add('ready'); sound('tab'); }
    })();
  }
  function analysisHtml(a) {
    var facts = a.facts.map(function (f) { return '<li class="' + (f.good ? 'up' : 'down') + '"><b>' + f.title + '</b><span>' + f.text + '</span></li>'; }).join('');
    var choices = a.choices.map(function (c) {
      var tag = c.effect > 0 ? '<em class="eff up">+' + c.effect + '%p</em>' : c.effect < 0 ? '<em class="eff down">−' + (-c.effect) + '%p</em>' : '<em class="eff">영향 작음</em>';
      return '<li><b>' + c.label + '</b>' + tag + '<span>' + c.text + '</span></li>';
    }).join('');
    return '<div class="ana-head"><div class="ana-pre"><small>경기 전 승률</small><b>' + a.pre + '%</b></div><h3>' + a.headline + '</h3></div>' +
      '<div class="ana-grid"><div><h4>승부를 가른 장면</h4><ul class="ana-facts">' + facts + '</ul></div><div><h4>내 선택 점검</h4><ul class="ana-choices">' + choices + '</ul></div></div>' +
      (a.advice ? '<p class="ana-advice"><b>다음 경기 제안</b>' + a.advice + '</p>' : '') +
      '<p class="ana-note">같은 조건의 모의 경기 ' + a.sims.toLocaleString('ko-KR') + '회로 계산했습니다. %p는 승률 차이(퍼센트포인트)이며 추정값입니다.</p>';
  }
  function finishWatched(m) { sound('swoosh'); wipe(function () { applyMatch(m); }); }
  function sound(n) { if (window.GameAudio) window.GameAudio.play(n); }
  function music(m) { if (window.GameAudio) window.GameAudio.mode(m); }
  function reduced() { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
  // 화면 전체를 덮었다가 걷어 내는 전환. hold가 있으면 소개 화면이 덮개를 이어받는다.
  function wipe(mid, hold) {
    var w = $('wipe');
    if (reduced()) { mid(); return; }
    w.className = 'wipe in';
    setTimeout(function () {
      mid();
      if (hold) { w.className = 'wipe'; return; }
      w.className = 'wipe out';
      setTimeout(function () { w.className = 'wipe'; }, 420);
    }, 330);
  }
  function showIntro(mine, opp, stake, done) {
    var el = $('intro');
    el.innerHTML = '<div class="i-side l">' + crest(mine, 120) + '<b>' + tname(mine) + '</b></div><div class="i-mid"><span>대</span></div><div class="i-side r">' + crest(opp, 120) + '<b>' + tname(opp) + '</b></div>' +
      '<div class="i-stake"><b>' + stake.big + '</b><small>' + stake.sub + '</small></div>';
    el.hidden = false;
    el.className = 'intro run';
    sound('drum');
    setTimeout(function () { sound('drum'); }, 320);
    var finished = false;
    function end() {
      if (finished) return;
      finished = true;
      el.removeEventListener('click', end);
      el.className = 'intro leave';
      done();
      setTimeout(function () { el.hidden = true; el.className = 'intro'; }, reduced() ? 0 : 380);
    }
    el.addEventListener('click', end);
    setTimeout(end, reduced() ? 900 : 2300);
  }
  // 결과 화면: 숫자가 올라가고 동전 소리가 난다.
  function countUp(el, to, fmt, ms) {
    if (reduced()) { el.textContent = fmt(to); return; }
    var t0 = performance.now();
    (function tick(n) {
      var k = Math.min(1, (n - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(Math.round(to * e));
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }
  function animateReport() {
    var r = report;
    if (!r) return;
    var won = r.winner === r.myside;
    sound(r.winner === null ? 'draw' : won ? 'win' : 'lose');
    document.querySelectorAll('[data-count]').forEach(function (el) { countUp(el, +el.getAttribute('data-count'), function (v) { return String(v); }, 800); });
    var mon = document.querySelector('[data-money]');
    if (mon) {
      var val = +mon.getAttribute('data-money');
      countUp(mon, val, function (v) { return (v > 0 ? '+' : '') + money(v); }, 900);
      if (val > 0) setTimeout(function () { sound('coin'); }, 950);
    }
    document.querySelectorAll('.grow').forEach(function (el, i) { setTimeout(function () { el.classList.add('show'); sound('click'); }, reduced() ? 0 : 1000 + i * 180); });
  }
  function say(res) { notice = res && !res.ok ? res.msg : ''; }
  var ACT = {
    prep: function () { prepOpen = true; sound('open'); render(); },
    prepClose: function () { prepOpen = false; sound('close'); render(); },
    tac: function (el) { st.myTactic[el.getAttribute('data-k')] = el.getAttribute('data-v'); sound('click'); persist(); render(); },
    pick: function (el) {
      var id = el.getAttribute('data-id'), t = M.my(st), prev = sel ? t.players.filter(function (p) { return p.id === sel; })[0] : null, p = t.players.filter(function (x) { return x.id === id; })[0];
      if (prev && prev.id !== id && prev.pos === p.pos) {
        var pStart = t.lineup[p.pos].indexOf(p.id), prevStart = t.lineup[p.pos].indexOf(prev.id);
        if (pStart >= 0 && prevStart < 0 && !prev.injury) { M.setSlot(st, p.pos, pStart, prev.id); sel = prev.id; flipIds = [p.id, prev.id]; sound('swap'); persist(); render(); return; }
        if (prevStart >= 0 && pStart < 0 && !p.injury) { M.setSlot(st, p.pos, prevStart, p.id); sel = p.id; flipIds = [p.id, prev.id]; sound('swap'); persist(); render(); return; }
      }
      sel = sel === id ? null : id; sound('click'); render();
    },
    nav: function (el) { if (view !== el.getAttribute('data-to')) { enter = true; sound('tab'); } view = el.getAttribute('data-to'); notice = ''; sel = null; prepOpen = false; pendingBuy = pendingSell = null; pendingReset = false; render(); window.scrollTo(0, 0); },
    choose: function (el) { sound('swoosh'); wipe(function () { M.chooseTeam(st, +el.getAttribute('data-team')); view = 'home'; enter = true; if (location.hash !== '#notitle') guide = { mode: 'intro', step: 0 }; persist(); render(); }); },
    guide: function () { guide = { mode: 'help', tab: 'roles' }; sound('open'); render(); },
    guideClose: function () { guide = null; sound('close'); render(); },
    guideNext: function () { guide.step++; sound('tab'); render(); },
    guidePrev: function () { guide.step--; sound('tab'); render(); },
    guideTab: function (el) { guide.tab = el.getAttribute('data-v'); sound('tab'); sheetScroll = 0; render(); var w = $('app').querySelector('.sheet-wrap'); if (w) w.scrollTop = 0; },
    quick: function () { sound('drum'); applyMatch(M.simulate(M.matchInput(st))); },
    watch: function () {
      var input = M.matchInput(st), u = st.upcoming, stake = M.stakes(st), mine = st.myTeam, opp = u.oppo;
      persist();
      prepOpen = false;
      sound('swoosh'); music('off');
      wipe(function () {
        document.body.className = 'in-match';
        $('app').hidden = true; $('hud').hidden = true; $('dock').hidden = true; $('lobbyBg').hidden = true;
        $('band').hidden = false; $('matchView').hidden = false;
        window.scrollTo(0, 0);
        var homeA = u.h === st.myTeam;
        window.Arena.watch(input.a, input.b, input.weather, input.seed, finishWatched, {
          myside: homeA ? 0 : 1, hold: true, live: stake.live,
          strengthDiff: M.strength(st.teams[u.h]) - M.strength(st.teams[u.a])
        });
        showIntro(mine, opp, stake, function () { window.Arena.go(); });
      }, 1);
    },
    auto: function () { M.my(st).lineup = M.autoLineup(M.my(st)); sound('swap'); persist(); render(); },
    focus: function (el) { st.training.focus = el.getAttribute('data-v'); sound('click'); persist(); render(); },
    intensity: function (el) { st.training.intensity = +el.getAttribute('data-v'); sound('click'); persist(); render(); },
    filter: function (el) { marketFilter = el.getAttribute('data-v'); render(); },
    buy: function (el) { pendingBuy = el.getAttribute('data-id'); pendingSell = null; render(); },
    buyYes: function (el) { var r0 = M.buy(st, el.getAttribute('data-id')); say(r0); sound(r0.ok ? 'buy' : 'deny'); pendingBuy = null; persist(); render(); },
    sell: function (el) { pendingSell = el.getAttribute('data-id'); pendingBuy = null; render(); },
    sellYes: function (el) { var r0 = M.sell(st, el.getAttribute('data-id')); say(r0); sound(r0.ok ? 'coin' : 'deny'); pendingSell = null; persist(); render(); },
    renew: function (el) { var r0 = M.renew(st, el.getAttribute('data-id')); say(r0); sound(r0.ok ? 'coin' : 'deny'); persist(); render(); },
    afterReport: function () { report = null; analysisRun = null; enter = true; sound('tab'); view = st.phase === 'offseason' ? 'offseason' : 'home'; render(); window.scrollTo(0, 0); },
    skipPlayoff: function () {
      var guard = 0;
      while (st.phase === 'playoff' && !st.upcoming && guard++ < 5) M.advanceWithoutUser(st);
      view = st.phase === 'offseason' ? 'offseason' : 'home';
      persist(); render();
    },
    nextSeason: function () { sound('swoosh'); wipe(function () { M.nextSeason(st); view = 'home'; enter = true; notice = ''; persist(); render(); window.scrollTo(0, 0); }); },
    login: function () { doLogin(); },
    logout: function () { if (cloud.auth) cloud.auth.signOut(); },
    conflictRemote: function () { var c = cloud.conflict; cloud.conflict = null; adopt(c.remote); persist(); showTitle(); },
    conflictLocal: function () { cloud.conflict = null; persist(); showTitle(); },
    exportSave: function () { pendingExport = !pendingExport; pendingImport = false; render(); },
    copySave: function () {
      var box = $('saveCode');
      box.select();
      var done = function () { notice = '기록을 복사했습니다.'; pendingExport = false; render(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) { /* 직접 복사 */ } });
      else { try { document.execCommand('copy'); done(); } catch (e) { /* 직접 복사 */ } }
    },
    importSave: function () { pendingImport = !pendingImport; pendingExport = false; render(); },
    importYes: function () {
      var data = null;
      try { data = JSON.parse($('importCode').value.trim()); } catch (e) { data = null; }
      if (!data || data.v !== 1 || !Array.isArray(data.teams)) { var m = $('importMsg'); if (m) m.textContent = '올바른 기록이 아닙니다. 복사한 내용 전체를 붙여 넣어 주세요.'; return; }
      adopt(data); pendingImport = false; notice = '기록을 불러왔습니다.'; persist(); render();
    },
    titleStart: function () { enterGame(); },
    titleNew: function () { titleConfirm = true; sound('tab'); paintTitle(); },
    titleNewNo: function () { titleConfirm = false; sound('tab'); paintTitle(); },
    titleNewYes: function () { titleConfirm = false; lsClear(); st = M.newGame((Date.now() % 2147483647) >>> 0); st.gameId = newGameId(); view = 'home'; notice = ''; persist(); enterGame(); },
    reset: function () { pendingReset = true; render(); },
    resetNo: function () { pendingReset = false; render(); },
    resetYes: function () { pendingReset = false; lsClear(); st = M.newGame((Date.now() % 2147483647) >>> 0); st.gameId = newGameId(); view = 'home'; notice = ''; persist(); render(); }
  };
  // 빈 곳을 빠르게 두 번 눌러도 화면이 확대되지 않게 한다. 버튼과 입력칸, 경기장은 그대로 둔다.
  var lastTap = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now(), t = e.target;
    var free = !(t.closest && t.closest('button, a, input, select, textarea, label, canvas'));
    if (free && now - lastTap < 320 && e.cancelable) e.preventDefault();
    lastTap = now;
  }, { passive: false });
  document.addEventListener('dblclick', function (e) { if (!(e.target.closest && e.target.closest('canvas, textarea, input'))) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (el && !el.disabled && ACT[el.getAttribute('data-act')]) ACT[el.getAttribute('data-act')](el);
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'prefSfx' || el.id === 'prefBgm') {
      if (window.GameAudio) { window.GameAudio.unlock(); window.GameAudio.setPref(el.id === 'prefSfx' ? 'sfx' : 'bgm', el.checked); }
      var other = $(el.id === 'prefSfx' ? 'sfxOn' : 'bgmOn'); if (other) other.checked = el.checked;
      return;
    }
    if (el.getAttribute('data-slot')) {
      var parts = el.getAttribute('data-slot').split(':');
      M.setSlot(st, parts[0], +parts[1], el.value);
      persist(); render();
    }
  });

  window.__mgr = { get st() { return st; }, M: M, render: render, setView: function (v) { view = v; render(); } };
  boot();
})();
</script>

</html>

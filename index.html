<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E2A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="창공배">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
<title>창공배 퀴디치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* 레이아웃: 보라색 대회 띠 아래로 점선 테두리 경기장과 연보라 정보판을 나란히 둔다. 대회 인쇄물 같은 단일 테마. */
:root {
  --page: #F1E6CF; --sheet: #FBF4E3; --ink: #1E2A38; --muted: #4A5361; --line: #BDB299;
  --plum: #1E2A38; --navy: #1E2A38; --gold: #E9BE52; --pink: #B8352A; --pink-soft: #BDB299; --violet: #B8352A;
  --white: #FFFDF4; --hud: rgba(30, 42, 56, .97); --red: #B8352A; --green: #2E6B4F; --yellow: #F6E6A8; --stub: #F4E8CC;
  --title: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --tag: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --big: 'Black Han Sans', 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'Noto Serif KR', 'Noto Serif CJK KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', 'Malgun Gothic', serif;
  --sans: 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --slab: 'Alfa Slab One', 'Black Han Sans', serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
.band { background: var(--plum); color: var(--white); border-bottom: 2px dashed var(--pink-soft); padding-block: 7px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: end; gap: 16px; }
.band .line { color: var(--gold); font: 700 12px/1.3 var(--body);  }
.band h1 { font: 400 26px/1.15 var(--big); margin: 0;  }
.band .right { text-align: right; min-width: 0; }
.band .match { font: 800 16px/1.3 var(--body);  }
.band .sc { color: var(--pink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
.wrap { grid-template-columns: minmax(0, 1fr); padding-block: 10px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; max-width: 1760px; margin: 0 auto; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; align-items: stretch; }
.frame { border: 1px dashed var(--pink); padding: 3px; min-width: 0; background: var(--white); align-self: start; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9.4; overflow: hidden; background: #1E5C3C; }
.stage:fullscreen { aspect-ratio: auto; }
canvas#view { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
canvas#view:active { cursor: grabbing; }
.strip { display: flex; flex-wrap: wrap; gap: 2px 8px; padding: 4px 6px 2px; color: var(--muted); font-size: 12px; }
.strip b { font: 700 12px/1.5 var(--body); color: var(--ink);  }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; padding: 0 4px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: rgba(24, 17, 72, .78); white-space: nowrap; will-change: transform; }
.lbl.on { background: var(--pink); font-weight: 700; }
.score { position: absolute; left: 8px; top: 8px; background: var(--hud); color: #FFFFFF; padding: 4px 8px 5px; min-width: 176px; pointer-events: none; }
.score .meta { display: flex; justify-content: space-between; color: var(--gold); font: 700 12px/1.5 var(--body);  font-variant-numeric: tabular-nums; }
.score .row { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; gap: 7px; align-items: center; font: 700 13px/1.45 var(--body);  }
.score .row .chip { width: 5px; height: 14px; border-radius: 0; }
.score .row b { font: 800 16px/1.2 var(--body); color: var(--gold); font-variant-numeric: tabular-nums; }
.score .foot { color: #EFECFD; font-size: 12px; border-top: 1px solid rgba(255, 255, 255, .22); margin-top: 3px; padding-top: 2px; }
.hit { position: absolute; left: 8px; top: 98px; background: var(--pink); color: #FFFFFF; font: 700 13px/1 var(--body); padding: 5px 9px; pointer-events: none; }
.coach { position: absolute; right: 8px; top: 8px; background: var(--hud); color: #FFFFFF; border-left: 3px solid #2FA9A0; padding: 4px 9px; pointer-events: none; }
.coach b { display: block; color: #6FDCCF; font: 700 12px/1.4 var(--body);  }
.coach span { font-size: 12px; color: #F1EFFD; }
.live { position: absolute; left: 8px; bottom: 8px; display: grid; gap: 3px; justify-items: start; max-width: 54%; pointer-events: none; }
.live .tags { display: flex; gap: 3px; }
.live .t { font: 700 12px/1.5 var(--body); padding: 0 5px; background: var(--hud); color: #FFFFFF;  }
.live .t.y { background: var(--gold); color: #231A00; }
.ticker { background: var(--hud); color: #FFFFFF; font-size: 14px; font-weight: 500; padding: 2px 7px; }
.card { position: absolute; left: 50%; bottom: 8px; transform: translateX(-16%); display: flex; align-items: stretch; background: var(--hud); color: #FFFFFF; pointer-events: none; border-bottom: 2px solid var(--pink); }
.card div { padding: 3px 9px 4px; display: grid; justify-items: center; border-right: 1px solid rgba(255, 255, 255, .18); }
.card div:last-child { border-right: 0; }
.card b { font: 800 15px/1.2 var(--body); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card b.y { color: var(--gold); }
.card span { font-size: 11px; color: #EFECFD; white-space: nowrap; }
.banner { --tc: #24114F; position: absolute; left: 50%; top: 18%; transform: translateX(-50%); display: grid; justify-items: center; gap: 1px; padding: 7px 30px; background: var(--tc); color: #FFFFFF; border: 2px dashed #FFFFFF; text-align: center; pointer-events: none; white-space: nowrap; animation: pop .2s ease-out; }
.banner b { font: 400 30px/1.15 var(--big); }
.banner span { font-size: 13px; font-weight: 500; }
.banner.gold { --tc: #F0C24B; color: #231A00; border-color: #231A00; }
@keyframes pop { from { transform: translateX(-50%) scale(.72); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .banner { animation: none; } }
.stage-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #FFFFFF; text-align: center; background: #1E5C3C; }
.result { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(24, 14, 60, .58); padding: 16px; }
.result-card { background: var(--sheet); color: var(--ink); padding: 18px 26px; display: grid; gap: 5px; justify-items: center; text-align: center; border: 1px dashed var(--pink); max-width: 100%; }
.result-card h2 { font: 400 28px/1.2 var(--big); margin: 0; }
.result-card .sc { font-weight: 700; }
.result-card .note { margin: 0; color: var(--muted); font-size: 13px; }
.result-card .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 7px; }
.side { position: relative; background: var(--sheet); border-top: 2px solid var(--violet); min-width: 0; }
.side-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 8px 12px 14px; display: grid; gap: 14px; align-content: start; }
.sec { display: grid; gap: 7px; min-width: 0; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sec-head h2 { font: 800 16px/1.2 var(--body); margin: 0;  }
.sec-head small { font-size: 12px; color: var(--muted); }
.field { display: grid; grid-template-columns: 54px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); background: var(--white); min-width: 0; }
.seg button { flex: 1 1 0; min-width: 0; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); font: 500 13px/1.2 var(--body); padding: 6px 2px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--navy); color: #FFFFFF; font-weight: 700; }
button.btn { font: 500 13px/1.25 var(--body); padding: 7px 8px; border: 1px solid var(--line); background: var(--white); color: var(--ink); cursor: pointer; }
button.btn.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; font-weight: 700; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 13px; }
.checks label { display: flex; align-items: center; gap: 5px; }
input[type=checkbox], input[type=range] { accent-color: var(--violet); }
input[type=range] { width: 100%; min-width: 0; }
.px { display: grid; grid-template-columns: minmax(0, 1fr) 24px; gap: 6px; align-items: center; color: var(--ink); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.tally th, .tally td { padding: 4px 3px; text-align: right; border-bottom: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.tally th { font: 700 12px/1.5 var(--body); color: var(--muted);  }
.tally th:first-child, .tally td:first-child { text-align: left; }
.tally td:nth-child(2) { font-weight: 700; }
.chip { display: inline-block; width: 9px; height: 9px; flex: none; margin-right: 4px; }
.log { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; border-left: 2px solid var(--pink); }
.log li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 6px; padding: 5px 6px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.log .tag { font: 700 12px/1.5 var(--body);  }
.log .tag.snitch { color: #9A7300; }
.log .clock { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: 5px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.nav { background: var(--sheet); border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav button { flex: none; background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: 500 14px/1.2 var(--body); padding: 11px 13px 9px; cursor: pointer; white-space: nowrap; }
.nav button.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--violet); }
.nav em { font: 700 12px/1 var(--body); font-style: normal; color: #231A00; background: var(--gold); padding: 1px 4px; margin-left: 2px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; max-width: 1240px; width: 100%; margin: 0 auto; }
.panel { background: var(--sheet); border-top: 2px solid var(--violet); padding: 12px 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.panel h2 { font: 800 18px/1.25 var(--body); margin: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 3px 12px; }
.head small { color: var(--muted); font-size: 12px; }
.lead { margin: 0; color: var(--muted); }
.notice { margin: 0; background: #FBE3EF; color: #7A1F4D; padding: 7px 12px; border-left: 3px solid var(--pink); }
.alert { margin: 0; background: #FDF2D3; color: #6B4E00; padding: 6px 10px; font-size: 13px; border-left: 3px solid #D9A62E; }
.tip { margin: 0; background: var(--white); padding: 7px 10px; font-size: 13px; border-left: 3px solid #2FA9A0; }
.grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pick { background: var(--white); border: 1px dashed var(--pink-soft); padding: 12px; display: grid; gap: 5px; min-width: 0; align-content: start; }
.pick h3 { font: 800 17px/1.3 var(--body); margin: 0 0 4px; }
.pick .btn { margin-top: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.kv span { color: var(--muted); }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; text-align: center; background: var(--plum); color: #FFFFFF; padding: 12px 8px; }
.versus b { font: 800 18px/1.25 var(--body);  }
.versus small { display: block; font-size: 12px; color: var(--pink-soft); font-variant-numeric: tabular-nums; }
.versus > span { font: 800 14px/1 var(--body); color: var(--gold); }
table.vs td, table.vs th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: center; font-size: 13px; }
table.vs th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.vs .win { font-weight: 700; color: #186B47; }
.num { font-variant-numeric: tabular-nums; }
.form3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.form3 label, .slots label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 10px; }
.cta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.cta.end { justify-content: center; }
button.btn.big { padding: 11px 16px; font-size: 14px; }
button.btn.small { padding: 4px 8px; white-space: nowrap; }
button.btn.danger { background: #A5283A; border-color: #A5283A; color: #FFFFFF; font-weight: 700; }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.goal { font: 800 19px/1.3 var(--body); margin: 0; }
.bar { display: block; height: 7px; background: var(--line); min-width: 60px; }
.bar i { display: block; height: 100%; background: #2FA9A0; }
.bar i.violet { background: var(--violet); }
.news { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.news li { padding: 5px 0; border-bottom: 1px solid var(--line); }
.t th, .t td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 14px; font-variant-numeric: tabular-nums; }
.t th { color: var(--muted); font-weight: 500; font-size: 12px; }
.t .left { text-align: left; }
.t tr.mine td { background: #EBE5FB; font-weight: 700; }
.t tr.po-cut td { border-bottom: 2px dashed var(--pink); }
.t td.key { font-weight: 700; }
.t td.form {  font-size: 12px; color: var(--muted); }
.players tr.starter td { background: var(--white); }
.dot { display: inline-block; width: 7px; height: 7px; background: var(--violet); border-radius: 50%; margin-right: 5px; }
.st { font-size: 12px; font-weight: 700; padding: 1px 5px; }
.st.good { background: #D6F0E2; color: #17603F; }
.st.warn { background: #FBEBC0; color: #6B4E00; }
.st.bad { background: #F9D5DE; color: #8A1F38; }
.seg.wrapped { flex-wrap: wrap; justify-self: start; }
.seg.wrapped button { flex: 1 1 auto; min-width: 64px; padding: 7px 10px; white-space: nowrap; }
.small-seg { max-width: 460px; }
.field span:first-child { color: var(--muted); }
.panel .field { grid-template-columns: 70px minmax(0, 1fr); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiles div { display: grid; gap: 1px; align-content: start; }
.tiles span { color: var(--muted); font-size: 12px; }
.tiles b { font: 400 25px/1.2 var(--big); font-variant-numeric: tabular-nums; }
.tiles b.sm { font-size: 16px; }
.neg { color: #A5283A; } .pos { color: #186B47; }
.report h2 { font-size: 30px; }
.report > small { color: var(--muted); }
.final { font-size: 16px; } .final b { font: 400 25px/1 var(--big); margin: 0 7px; font-variant-numeric: tabular-nums; }
.bracket { display: grid; gap: 5px; font-size: 13px; }
.bracket > div { background: var(--white); padding: 6px 9px; }
.bracket small { color: var(--muted); margin-right: 7px; }
.bracket b { margin: 0 4px; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.rate-table th, .rate-table td { padding: 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12px; }
.rate-table th { color: var(--muted); font: 700 12px/1.5 var(--body); }
.rate-table th:first-child, .rate-table td:first-child, .rate-table th:nth-child(2), .rate-table td:nth-child(2) { text-align: left; }
.rate-table td.rate { font-weight: 700; }
.rate-table tr.split td { border-top: 2px solid var(--muted); }
.setup-panel h2 { font: 800 16px/1.2 var(--body); margin: 0; }
.setup { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
fieldset.team { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 7px 10px; min-width: 0; }
fieldset.team legend { font-weight: 700; padding: 0 0 5px; display: flex; align-items: center; }
fieldset.team label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
select { font: inherit; font-size: 13px; background: var(--white); color: var(--ink); border: 1px solid var(--line); padding: 5px 6px; max-width: 100%; width: 100%; }
.setup-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); }
.setup-actions .field { grid-template-columns: auto 240px; }
@media (max-width: 1100px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { min-height: 0; }
  .side-scroll { position: static; overflow: visible; }
}
@media (max-width: 820px) {
  .grid, .cards { grid-template-columns: minmax(0, 1fr); }
  .form3 { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 680px) {
  .band h1 { font-size: 20px; }
  .band .match { font-size: 12px; }
  .stage { aspect-ratio: 4 / 3; }
  .coach, .live .tags { display: none; }
  .score { min-width: 130px; left: 4px; top: 4px; padding: 3px 6px; }
  .score .row { font-size: 12px; }
  .score .foot { display: none; }
  .hit { top: 72px; left: 4px; }
  .card { left: auto; right: 4px; bottom: 4px; transform: none; }
  .card div { padding: 2px 5px 3px; }
  .card div.extra { display: none; }
  .card b { font-size: 12px; }
  .live { left: 4px; bottom: 44px; max-width: 94%; }
  .ticker { font-size: 12px; }
  .banner { padding: 5px 16px; top: 22%; }
  .banner b { font-size: 22px; }
  .setup { grid-template-columns: minmax(0, 1fr); }
  .setup-actions .field { grid-template-columns: auto minmax(0, 1fr); width: 100%; }
}

.cut { position: absolute; inset: 0; background: #120D36; opacity: 0; pointer-events: none; }
.cut.run { animation: cutfade .45s ease-out; }
@keyframes cutfade { from { opacity: 1; } to { opacity: 0; } }
/* 게임 셸 */
body.on-lobby { background: #17123F; }
body.on-page { background: var(--page); }
.lobby-bg { position: fixed; inset: 0; z-index: 0; background: linear-gradient(#2A2A6A, #1E5C3C); overflow: hidden; }
.lobby-bg canvas#view { pointer-events: none; }
.lobby-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,14,62,.82), rgba(20,14,62,.2) 62%, rgba(20,14,62,.45)), linear-gradient(0deg, rgba(20,14,62,.72), rgba(20,14,62,0) 30%); }
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--plum); color: #FFFFFF; border-bottom: 2px solid var(--gold); padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.h-club { display: flex; align-items: center; gap: 9px; min-width: 0; }
.h-club b { display: block; font: 800 18px/1.15 var(--body);  white-space: nowrap; }
.h-club small { color: #F4DCEA; font-size: 12px; white-space: nowrap; }
.crest { flex: none; display: block; }
.h-stats { display: flex; gap: 8px; }
.h-stat { background: rgba(255,255,255,.1); padding: 3px 12px 4px; text-align: center; min-width: 62px; }
.h-stat small { display: block; font-size: 12px; color: #F4DCEA; }
.h-stat b { font: 800 21px/1.05 var(--body); font-variant-numeric: tabular-nums; }
.h-stat b i { font-style: normal; font-size: 12px; margin-left: 1px; }
.h-stat.coin b { color: var(--gold); }
.dock { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--plum); border-top: 2px solid var(--gold); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dock button { position: relative; background: transparent; border: 0; color: #EFECFD; cursor: pointer; padding: 8px 2px 7px; display: grid; justify-items: center; gap: 2px; font: 500 13px/1.2 var(--body); min-width: 0; }
.dock button.on { color: var(--gold); background: rgba(255,255,255,.09); font-weight: 700; }
.ic { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dock em { position: absolute; top: 4px; left: calc(50% + 7px); min-width: 17px; height: 17px; padding: 0 4px; background: #E23A4E; color: #FFFFFF; font: 700 12px/17px var(--body); font-style: normal; border-radius: 9px; text-align: center; }
.dock em.new { background: var(--gold); color: #231A00; }
body.on-lobby .wrap, body.on-page .wrap { position: relative; z-index: 1; min-height: calc(100dvh - 130px); align-content: start; }
body.in-match { background: var(--page); }
.pick { color: var(--ink); }

.choose { display: grid; gap: 14px; justify-items: center; text-align: center; color: #FFFFFF; max-width: 1000px; width: 100%; margin: 0 auto; padding-top: 3vh; }
.choose h1 { font: 400 40px/1.15 var(--big); margin: 0;  }
.choose p { margin: 0; color: #FFFFFF; background: rgba(24, 17, 72, .85); padding: 5px 14px; }
.choose h1 { background: rgba(24, 17, 72, .85); padding: 6px 22px 8px; }
.choose .cards { width: 100%; }
.choose .pick { background: rgba(24, 17, 72, .93); color: #FFFFFF; border: 2px solid var(--gold); padding: 16px; justify-items: center; gap: 8px; }
.choose .pick h3 { font: 400 25px/1.15 var(--big); margin: 0; }
.pick-ov { display: grid; justify-items: center; }
.pick-ov small { font-size: 12px; color: #EFECFD; }
.pick-ov b { font: 400 44px/1 var(--big); color: var(--gold); }
.pick-line { display: flex; justify-content: space-between; gap: 10px; width: 100%; font-size: 13px; border-top: 1px solid rgba(255,255,255,.18); padding-top: 5px; }
.pick-line span { color: #EFECFD; }
.choose .play { font-size: 20px; padding: 10px 12px 8px; margin-top: 6px; }
.choose-foot { font-size: 13px; }

/* 로비 */
.lobby { display: grid; grid-template-rows: 1fr auto; gap: 12px; min-height: calc(100dvh - 165px); max-width: 1240px; margin: 0 auto; width: 100%; }
.l-main { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 270px); justify-content: space-between; gap: 18px; align-items: center; }
.mcard { background: rgba(24, 17, 72, .93); color: #FFFFFF; border: 2px solid var(--gold); padding: 16px 20px 20px; display: grid; gap: 13px; }
.m-top { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; color: #F1EFFD; font-size: 13px; }
.m-top .w { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); }
.m-top .ic { width: 17px; height: 17px; }
.m-vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.m-team { display: grid; justify-items: center; gap: 5px; text-align: center; min-width: 0; }
.m-team b { font: 800 23px/1.15 var(--body);  }
.m-team small { color: #EFECFD; font-size: 12px; }
.m-mid { font: 800 22px/1 var(--body); color: var(--gold); }
.m-hint { margin: 0; text-align: center; color: #F1EFFD; }
.m-hint b { color: #FFFFFF; }
.m-alert { background: #6B1E33; border: 0; color: #FFE1E7; font: 500 13px/1.3 var(--body); padding: 7px; cursor: pointer; }
.play { background: linear-gradient(#F7D468, #E4AE2A); color: #2A1E00; border: 0; border-bottom: 4px solid #A87A12; font: 400 28px/1.15 var(--big);  padding: 14px 18px 11px; cursor: pointer; width: 100%; transition: transform .08s; }
.play:hover { filter: brightness(1.06); }
.play:active { transform: translateY(2px); border-bottom-width: 2px; }
.play:disabled { opacity: .45; cursor: not-allowed; }
.ghost { background: transparent; color: inherit; border: 1px solid currentColor; font: 500 14px/1.2 var(--body); padding: 11px 14px; cursor: pointer; width: 100%; }
.m-title { font: 400 26px/1.2 var(--big); margin: 0; text-align: center; }
.m-bracket .bracket > div { background: rgba(255,255,255,.1); }
.m-bracket .bracket small { color: #EFECFD; }
.l-side { display: grid; gap: 10px; }
.l-box { background: rgba(24, 17, 72, .85); color: #FFFFFF; padding: 11px 14px; display: grid; gap: 5px; }
.l-box small { color: #F4DCEA; font-size: 12px; }
.l-box > b { font: 800 18px/1.3 var(--body); }
.l-box > span:last-child { font-size: 12px; color: #EFECFD; }
.l-box .bar { background: rgba(255,255,255,.2); }
.bar i.gold { background: var(--gold); }
.dots { display: flex; gap: 4px; }
.dots i { font: 700 12px/26px var(--body); font-style: normal; width: 26px; height: 26px; text-align: center; color: #FFFFFF; }
.dots i.W { background: #208A5B; } .dots i.L { background: #B23A4E; } .dots i.D { background: #6D6A94; }
.dots span { font-size: 12px; color: #EFECFD; }
.ticker-l { margin: 0; background: rgba(24, 17, 72, .85); color: #FFFFFF; padding: 7px 12px; font-size: 13px; }
.ticker-l b { color: var(--gold); font: 700 13px/1 var(--body); margin-right: 9px; }

/* 경기 준비 */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(14, 10, 44, .7); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.sheet { background: #1C1548; color: #FFFFFF; border: 2px solid var(--gold); padding: 14px 18px 18px; width: min(560px, 100%); display: grid; gap: 8px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet h2 { font: 800 22px/1.2 var(--body); margin: 0; }
.sheet h3 { font: 500 13px/1.2 var(--body); color: #EFECFD; margin: 6px 0 0; }
.close { background: transparent; border: 0; color: #FFFFFF; font-size: 28px; line-height: 1; width: 40px; height: 40px; cursor: pointer; }
.sheet-tip { margin: 0; color: var(--gold); font-size: 13px; }
.tacs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tacs.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tac { background: rgba(255,255,255,.08); border: 2px solid transparent; color: #FFFFFF; padding: 9px 6px; display: grid; gap: 3px; justify-items: center; text-align: center; cursor: pointer; min-width: 0; }
.tac b { font: 800 17px/1.2 var(--body); }
.tac span { font-size: 12px; color: #EFECFD; }
.tac.on { background: rgba(240,194,75,.2); border-color: var(--gold); }
.tac.on b { color: var(--gold); }
.sheet-cta { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 8px; align-items: stretch; }
.sheet-cta .play { font-size: 24px; }

/* 선수단 배치판 */
.squad { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
.board-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.sq-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.sq-head h2 { font: 800 21px/1.2 var(--body); margin: 0; }
.sq-meta { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.sq-meta b { font: 800 18px/1 var(--body); color: var(--ink); font-variant-numeric: tabular-nums; }
.board { position: relative; display: grid; gap: 12px; padding: 18px 10px; overflow: hidden; background: radial-gradient(ellipse 34% 20% at 50% 100%, #23968F 98%, transparent 100%), radial-gradient(ellipse 34% 20% at 50% 0%, #23968F 98%, transparent 100%), repeating-linear-gradient(0deg, #2F9238 0 52px, #2A8733 52px 104px); border: 4px solid #F5D6BC; border-radius: 48% / 16%; }
.board::before { content: ""; position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,.75); border-radius: 50%; }
.board::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 3px solid rgba(255,255,255,.75); }
.b-row { position: relative; z-index: 1; display: flex; justify-content: center; gap: 10px; }
.pc { position: relative; flex: 0 0 auto; width: clamp(94px, 13vw, 122px); display: grid; justify-items: center; gap: 2px; padding: 6px 6px 8px; background: #FFFDF6; color: var(--ink); border: 3px solid #AEB3C4; border-radius: 6px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.28); transition: transform .08s; }
.pc:hover { transform: translateY(-2px); }
.pc.gold { border-color: #E2AE2C; background: linear-gradient(#FFF6D6, #FFFDF6 55%); }
.pc.silver { border-color: #A6B3C9; background: linear-gradient(#EEF2F8, #FFFDF6 55%); }
.pc.bronze { border-color: #C58A5D; background: linear-gradient(#F8E7D8, #FFFDF6 55%); }
.pc.sel { outline: 4px solid var(--violet); outline-offset: 1px; }
.pc.swap { box-shadow: 0 0 0 4px var(--gold), 0 3px 0 rgba(0,0,0,.28); animation: swapglow 1s ease-in-out infinite alternate; }
@keyframes swapglow { to { box-shadow: 0 0 0 2px var(--gold), 0 0 12px 4px rgba(240,194,75,.8); } }
@media (prefers-reduced-motion: reduce) { .pc.swap { animation: none; } }
.pc.hurt { filter: grayscale(.7); }
.pc-ov { position: absolute; left: 6px; top: 3px; font: 400 25px/1 var(--big); font-variant-numeric: tabular-nums; }
.pc-pos { align-self: start; justify-self: end; font-size: 11px; color: var(--muted); }
.jersey { width: 56%; display: block; }
.pc-nick { font-size: 12px; font-weight: 800; color: #9A6B00; line-height: 1.1; }
.pc-name { font: 800 14px/1.2 var(--body); word-break: keep-all; text-align: center; min-height: 2.4em; display: flex; align-items: center; }
.pc-cond { display: block; width: 88%; height: 6px; background: #DDD9E7; }
.pc-cond i { display: block; height: 100%; }
.pc-cond i.good { background: #2AA36B; } .pc-cond i.warn { background: #E5A92C; } .pc-cond i.bad { background: #D5405A; }
.pc-state { font-size: 12px; font-weight: 700; color: #B02A44; }
.pc.small { width: 92px; flex: none; }
.pc.small .pc-ov { font-size: 21px; }
.bench h3 { font: 800 15px/1.2 var(--body); margin: 0 0 7px; }
.b-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 9px; }
.b-strip p { margin: 0; color: var(--muted); }
.detail { position: sticky; top: 64px; background: #1C1548; color: #FFFFFF; padding: 14px 16px 16px; display: grid; gap: 11px; border: 2px solid var(--gold); }
.detail h2 { font: 800 21px/1.2 var(--body); margin: 0; }
.detail.empty p { margin: 0; color: #EFECFD; }
.d-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.d-head small { color: #EFECFD; font-size: 12px; }
.d-ov { font: 400 32px/1 var(--big); width: 56px; height: 56px; line-height: 56px; text-align: center; background: #6D6A94; color: #FFFFFF; font-variant-numeric: tabular-nums; }
.d-ov.gold { background: #E2AE2C; color: #231A00; } .d-ov.silver { background: #A6B3C9; color: #17132F; } .d-ov.bronze { background: #C58A5D; color: #231306; }
.attrs { display: grid; gap: 6px; }
.attr { display: grid; grid-template-columns: 38px minmax(0, 1fr) 24px; gap: 7px; align-items: center; font-size: 12px; color: #EFECFD; }
.attr b { text-align: right; font-variant-numeric: tabular-nums; color: #FFFFFF; }
.a-bar { display: block; height: 8px; background: rgba(255,255,255,.14); }
.a-bar i { display: block; height: 100%; background: #8E7BE0; }
.attr.key .a-bar i { background: var(--gold); }
.attr.key span:first-child { color: var(--gold); font-weight: 700; }
.d-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.d-facts small { display: block; font-size: 12px; color: #EFECFD; }
.d-facts b { font-size: 15px; font-variant-numeric: tabular-nums; }
.d-hint { margin: 0; color: var(--gold); font-size: 13px; }
@media (max-width: 900px) {
  .l-main { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .lobby-bg::after { background: linear-gradient(0deg, rgba(20,14,62,.86), rgba(20,14,62,.3)); }
  .squad { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
}
@media (max-width: 480px) {
  .mcard { padding: 12px 12px 14px; }
  .m-team b { font-size: 18px; }
  .m-team .crest { width: 62px; height: 62px; }
  .h-club b { font-size: 15px; }
  .h-stat { min-width: 50px; padding: 2px 8px 3px; }
  .h-stat b { font-size: 18px; }
  .dock button { font-size: 12px; }
  .ic { width: 22px; height: 22px; }
  .tac span { font-size: 12px; }
  .b-row { gap: 6px; }
  .pc { width: clamp(88px, 28vw, 112px); }
  .board { border-radius: 30% / 10%; padding: 16px 4px; }
}

/* 경기 긴장감 표시 */
.wp { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: min(34%, 380px); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; background: var(--hud); color: #FFFFFF; padding: 4px 8px 3px; pointer-events: none; }
.wp small { grid-column: 1 / -1; text-align: center; font-size: 12px; color: #EFECFD; line-height: 1; }
.wp-v { font: 800 14px/1 var(--body); font-variant-numeric: tabular-nums; min-width: 32px; }
.wp-v:last-of-type { text-align: right; }
.wp-bar { height: 9px; background: var(--wp-b, #2CA6A0); overflow: hidden; }
.wp-bar i { display: block; height: 100%; background: var(--wp-a, #D53B33); transition: width .7s cubic-bezier(.2, .7, .2, 1); }
.climax { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); background: #F0C24B; color: #231A00; font: 800 18px/1.25 var(--body); padding: 6px 16px; pointer-events: none; white-space: nowrap; animation: climaxIn .25s ease-out, climaxPulse .8s ease-in-out .25s infinite alternate; }
@keyframes climaxIn { from { transform: translateX(-50%) translateY(14px); opacity: 0; } }
@keyframes climaxPulse { to { box-shadow: 0 0 0 5px rgba(240, 194, 75, .4); } }
.score .row b.bump { animation: bump .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.8); color: #FFFFFF; } 100% { transform: scale(1); } }
.score .foot.warn { color: #FFB4C2; font-weight: 700; }
.banner.quiet { top: 18%; padding: 5px 20px; border-style: solid; border-width: 1px; }
.banner.quiet b { font-size: 20px; }
.banner.quiet span { font-size: 12px; }
.aura-cell .aura { display: block; width: 44px; height: 5px; background: rgba(255,255,255,.2); margin: 1px 0; }
.aura-cell .aura i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .5s linear; }
.card.hot { border-bottom-color: var(--gold); }
.card.hot #cSnitch { color: var(--gold); }
.m-stake { display: grid; gap: 1px; justify-items: center; background: rgba(240, 194, 75, .15); padding: 7px 10px; text-align: center; }
.m-stake b { font: 800 19px/1.25 var(--body); color: var(--gold); }
.m-stake small { font-size: 12px; color: #F4F2FE; }
.sheet-stake { margin: 0; font: 800 18px/1.3 var(--body); color: #FFFFFF; }
.result-card h2.won { color: #186B47; animation: slam .45s cubic-bezier(.2, 1.4, .4, 1); }
.result-card h2.lost { color: #A5283A; animation: slam .45s cubic-bezier(.2, 1.4, .4, 1); }

/* 전환 */
.wipe { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; visibility: hidden; }
.wipe i { position: absolute; top: -5%; bottom: -5%; width: 62%; background: #1D1650; border: 0 solid var(--gold); transition: transform .32s cubic-bezier(.7, 0, .3, 1); }
.wipe i:first-child { left: -6%; transform: translateX(-108%) skewX(-8deg); border-right-width: 5px; }
.wipe i:last-child { right: -6%; transform: translateX(108%) skewX(-8deg); border-left-width: 5px; }
.wipe.in, .wipe.out { visibility: visible; pointer-events: auto; }
.wipe.in i:first-child, .wipe.in i:last-child { transform: translateX(0) skewX(-8deg); }
.wipe.out i { transition-duration: .38s; }
.intro { position: fixed; inset: 0; z-index: 41; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-rows: 1fr auto; gap: 18px 12px; align-items: center; padding: 8vh 4vw; background: #1D1650; color: #FFFFFF; cursor: pointer; }
.intro .i-side { display: grid; justify-items: center; gap: 10px; text-align: center; }
.intro .i-side b { font: 400 clamp(22px, 3.6vw, 44px)/1.15 var(--big); }
.intro .i-side .crest { width: clamp(84px, 13vw, 170px); height: auto; }
.intro .i-mid span { font: 400 clamp(26px, 4vw, 52px)/1 var(--big); color: var(--gold); }
.intro .i-stake { grid-column: 1 / -1; display: grid; gap: 3px; justify-items: center; text-align: center; }
.intro .i-stake b { font: 400 clamp(20px, 3vw, 34px)/1.2 var(--big); color: var(--gold); }
.intro .i-stake small { font-size: 15px; color: #F4F2FE; }
.intro.run .i-side.l { animation: fromL .5s cubic-bezier(.2, 1.1, .3, 1) both; }
.intro.run .i-side.r { animation: fromR .5s cubic-bezier(.2, 1.1, .3, 1) both; }
.intro.run .i-mid { animation: slam .35s cubic-bezier(.2, 1.6, .4, 1) .3s both; }
.intro.run .i-stake { animation: rise .4s ease-out .55s both; }
.intro.leave { animation: leave .36s ease-in forwards; }
@keyframes fromL { from { transform: translateX(-60vw); opacity: 0; } }
@keyframes fromR { from { transform: translateX(60vw); opacity: 0; } }
@keyframes slam { from { transform: scale(2.4); opacity: 0; } }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
@keyframes leave { to { transform: scale(1.12); opacity: 0; } }
/* 화면 진입 */
.app.enter > *, .app.enter .col > * { animation: rise .32s ease-out both; }
.app.enter .mcard { animation: fromL .42s cubic-bezier(.2, 1, .3, 1) both; }
.app.enter .l-box { animation: fromR .42s cubic-bezier(.2, 1, .3, 1) both; }
.app.enter .l-box:nth-child(2) { animation-delay: .07s; }
.app.enter .pick:nth-child(1) { animation: rise .4s ease-out .05s both; }
.app.enter .pick:nth-child(2) { animation: rise .4s ease-out .14s both; }
.app.enter .pick:nth-child(3) { animation: rise .4s ease-out .23s both; }
.app.enter .pc { animation: cardIn .34s cubic-bezier(.2, 1.3, .4, 1) both; }
.app.enter .b-row:nth-child(2) .pc { animation-delay: .05s; }
.app.enter .b-row:nth-child(3) .pc { animation-delay: .1s; }
.app.enter .b-row:nth-child(4) .pc { animation-delay: .15s; }
.app.enter .b-strip .pc { animation-delay: .2s; }
@keyframes cardIn { from { transform: translateY(16px) scale(.86); opacity: 0; } }
.pc.flip { animation: flip .42s ease-out; }
@keyframes flip { 0% { transform: perspective(500px) rotateY(90deg); } 100% { transform: perspective(500px) rotateY(0); } }
.sheet-wrap.opening { animation: fade .18s ease-out; }
.sheet-wrap.opening .sheet { animation: sheetUp .26s cubic-bezier(.2, 1.1, .3, 1); }
@keyframes fade { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(26px) scale(.97); opacity: 0; } }
.tac { transition: transform .1s, background .12s, border-color .12s; }
.tac:active, .dock button:active, .btn:active, .ghost:active { transform: scale(.96); }
@keyframes pop2 { 50% { transform: scale(1.05); } }
.dock button { transition: background .15s, color .15s; }
.dock button.on .ic { animation: pop2 .28s ease-out; }
.play { animation: breathe 1.7s ease-in-out infinite alternate; }
@keyframes breathe { to { box-shadow: 0 0 18px rgba(240, 194, 75, .55); } }
.slam { animation: slam .46s cubic-bezier(.2, 1.4, .4, 1); transform-origin: left center; }
.result-card { animation: sheetUp .3s cubic-bezier(.2, 1.1, .3, 1); }
.grows { display: flex; flex-wrap: wrap; gap: 5px; }
.grow { background: #E6F6EC; color: #186B47; font-size: 12px; font-weight: 700; padding: 3px 8px; opacity: 0; transform: translateY(8px) scale(.9); transition: opacity .25s, transform .25s cubic-bezier(.2, 1.6, .4, 1); }

.fs-bar button:active { background: rgba(255, 255, 255, .18); }

body.fs-on .live { left: max(8px, env(safe-area-inset-left, 0px)); bottom: calc(max(8px, env(safe-area-inset-bottom, 0px)) + 54px); max-width: 30%; transition: bottom .25s; }
body.fs-on.fs-idle .live { bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
body.fs-on .climax { bottom: calc(max(8px, env(safe-area-inset-bottom, 0px)) + 112px); }
/* 가로로 눕힌 휴대폰 */

  body.fs-on .climax { font-size: 13px; bottom: calc(max(6px, env(safe-area-inset-bottom, 0px)) + 88px); }
}
/* 세로 휴대폰 */
@media (max-width: 680px) {
  .fs-enter { width: 38px; height: 38px; padding: 7px; right: 4px; bottom: auto; top: 44px; }
  body.fs-on .score { left: max(6px, env(safe-area-inset-left, 0px)); }

/* 팀 색 표시 */
.lbl.on { font-size: 12px; font-weight: 800; padding: 1px 6px; box-shadow: 0 0 0 2px #FFFFFF, 0 2px 6px rgba(0,0,0,.5); }
.lbl.on::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -5px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid #FFFFFF; }
.card { --team: var(--pink); border-left: 7px solid var(--team); border-bottom-color: var(--team); }
.c-team { display: flex; gap: 3px; align-items: center; }
.c-team i { font-style: normal; font-size: 10px; font-weight: 800; background: var(--gold); color: #231A00; padding: 0 3px; }
/* 승패 원인 분석 */
.analysis { background: var(--white); border: 1px dashed var(--pink-soft); padding: 13px 14px; display: grid; gap: 12px; min-width: 0; }
.ana-wait { margin: 0; font-weight: 500; }

.ana-head { display: flex; align-items: center; gap: 14px; }

.ana-pre small { display: block; font-size: 12px; color: #F4DCEA; white-space: nowrap; }
.ana-pre b { font: 400 26px/1.1 var(--big); color: var(--gold); font-variant-numeric: tabular-nums; }
.ana-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

.ana-facts li { border-left: 4px solid #8A86A8; padding: 2px 0 2px 9px; display: grid; gap: 1px; }
.ana-facts li.up { border-left-color: #1E8A5C; }
.ana-facts li.down { border-left-color: #C23A52; }
.ana-facts b, .ana-choices b { font-weight: 800; font-size: 14px; }
.ana-facts span, .ana-choices span { font-size: 14px; color: var(--muted); line-height: 1.45; }
.ana-choices li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.ana-choices span { grid-column: 1 / -1; }
.eff { font-style: normal; font-size: 13px; font-weight: 800; color: var(--muted); }
.eff.up { color: #186B47; } .eff.down { color: #A5283A; }
.ana-advice { margin: 0; background: #FDF2D3; color: #4E3900; padding: 8px 11px; font-size: 14px; }

.rate-head { font: 800 16px/1.3 var(--body); margin: 2px 0 -3px; }
@media (max-width: 760px) {
  .ana-grid { grid-template-columns: minmax(0, 1fr); }
  .ana-head h3 { font-size: 18px; }
}

/* 긴 팀 이름이 글자 중간에서 끊기지 않게 한다. */
body { word-break: keep-all; overflow-wrap: anywhere; }
/* ===== 빈티지 스포츠 포스터 테마 ===== */
/* 첫 화면: 3D 경기장 위에 인쇄된 표지를 올린다 */
body.on-title { background: var(--ink); overflow: hidden; }
body.on-title .lobby-bg::after { background: none; }
.title { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); background: var(--page); color: var(--ink); text-align: center; overflow: auto; }
.title.ready { background: transparent; }
.t-inner { display: grid; justify-items: center; gap: 14px; width: min(100%, 440px); animation: rise .6s ease-out both; }
.t-inner > span { display: none; }
.t-head { display: grid; justify-items: center; gap: 4px; width: 100%; background: var(--sheet); border: 3px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); padding: 14px 18px 12px; transform: rotate(-.8deg); }
.t-hoops { width: 92px; height: auto; }
.t-hoops g, .t-hoops path { stroke: var(--red); }
.title h1 { margin: 0; font: 400 clamp(50px, 11vmin, 88px)/1.03 var(--big); color: var(--red); }
.title h1 span { display: block; color: var(--ink); }
.t-sub { margin: 4px 0 0; padding-top: 6px; border-top: 3px double var(--ink); width: 100%; font-size: 16px; font-weight: 700; }
.t-actions { display: grid; justify-items: center; gap: 8px; width: 100%; }
.t-play { width: min(100%, 320px); }
.t-save { margin: 0; background: var(--sheet); border: 2px solid var(--ink); padding: 3px 10px; font-size: 14px; font-weight: 500; }
.t-save b { font-weight: 900; }
.t-warn { margin: 0; background: var(--sheet); border: 2px solid var(--ink); padding: 8px 12px; font-size: 15px; font-weight: 500; }
.t-link { background: var(--sheet); border: 2px solid var(--ink); color: var(--ink); font: 700 14px/1.2 var(--body); min-height: 44px; padding: 0 16px; cursor: pointer; }
@media (max-aspect-ratio: 3/4) {
  .t-inner { height: 100%; align-content: space-between; grid-template-rows: auto minmax(0, 1fr) auto; padding-block: 3vh 2vh; }
  .t-inner > span { display: block; }
}
@media (max-height: 460px) {
  .t-hoops { display: none; }
  .title h1 { font-size: 40px; }
  .title h1 span { display: inline; margin-left: .25em; }
  .t-head { padding: 8px 14px 7px; }
}
@media (prefers-reduced-motion: reduce) { .t-inner { animation: none; } }

/* 바탕과 공통 */
html, body { overflow-x: clip; }
body { font-weight: 500; }
body.on-lobby { background: var(--page); }
body.on-lobby::before { content: ""; position: fixed; left: 50%; top: 44%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; background: repeating-conic-gradient(#E7D6B4 0deg 7.5deg, var(--page) 7.5deg 15deg); pointer-events: none; z-index: 0; }
body.on-page, body.in-match { background: var(--page); }
.pos-chaser { background: #B8352A; color: #FFFFFF; }
.pos-beater { background: #1E2A38; color: #FFFFFF; }
.pos-keeper { background: #2E6B4F; color: #FFFFFF; }
.pos-seeker { background: #E0B23C; color: #1E2A38; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

/* 윗줄과 메뉴 */
.hud { background: var(--page); color: var(--ink); border-bottom: 5px double var(--ink); }
.h-club b { font: 400 22px/1.1 var(--big); color: var(--red); }
.h-club small { color: var(--ink); font-size: 13px; font-weight: 700; }
.h-stats { gap: 0; }
.h-stat { background: transparent; padding: 0 14px; min-width: 0; border-left: 2px solid var(--ink); text-align: right; }
.h-stat:first-child { border-left: 0; }
.h-stat small { color: var(--ink); font-weight: 700; }
.h-stat b { font: 400 21px/1.15 var(--slab); }
.h-stat b i { font: 700 13px var(--body); }
.h-stat.coin b { color: var(--red); }
.dock { background: var(--ink); border-top: 4px solid var(--red); }
.dock button { color: var(--sheet); padding: 0 2px; min-height: 52px; align-content: center; font: 400 clamp(15px, 2vw, 21px)/1 var(--big); }
.dock button + button { border-left: 1px solid #5A6878; }
.dock button.on { background: var(--red); color: var(--sheet); font-weight: 400; }
.dock em { top: 4px; left: calc(50% + 14px); background: var(--gold); color: var(--ink); font: 700 12px/17px var(--sans); border-radius: 0; }
.dock em.new { background: var(--gold); color: var(--ink); }

/* 버튼 */
.play { background: var(--red); color: var(--sheet); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); font: 400 26px/1.15 var(--big); padding: 12px 18px 10px; animation: none; }
.play:hover { filter: none; background: #A52D23; }
.play:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); border-bottom-width: 3px; }
.ghost { background: var(--sheet); color: var(--ink); border: 2px solid var(--ink); font: 700 14px/1.2 var(--body); min-height: 44px; }
button.btn { font: 700 13px/1.25 var(--body); padding: 8px 10px; border: 2px solid var(--ink); background: var(--sheet); color: var(--ink); }
button.btn.primary { background: var(--red); border-color: var(--ink); color: var(--sheet); box-shadow: 3px 3px 0 var(--ink); }
button.btn.danger { background: var(--red); border-color: var(--ink); color: var(--sheet); }
button.btn.big { font: 400 20px/1.2 var(--big); padding: 11px 22px 9px; }
.seg { border: 2px solid var(--ink); background: var(--sheet); }
.seg button { border-right: 1px solid var(--ink); font: 700 13px/1.2 var(--body); }
.seg button.on { background: var(--ink); color: var(--gold); }
input[type=checkbox], input[type=range] { accent-color: var(--red); }
select { border: 2px solid var(--ink); background: var(--sheet); }

/* 구단 선택 */
.choose { color: var(--ink); position: relative; z-index: 1; }
.choose h1 { background: none; padding: 0; font: 400 clamp(42px, 8vw, 66px)/1.05 var(--big); color: var(--red); }
.choose p { background: none; color: var(--ink); font-size: 16px; font-weight: 700; padding: 0; }
.choose .pick { background: var(--sheet); color: var(--ink); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
.pick-ov small { color: var(--ink); font-size: 13px; font-weight: 700; }
.pick-ov b { font: 400 46px/1 var(--slab); color: var(--red); }
.pick-line { border-top: 1px solid var(--ink); }
.pick-line span { color: var(--muted); }
.pick-line b { font-weight: 900; text-align: right; }
.choose .play { width: 100%; }
.choose-foot { font-size: 14px !important; }

/* 로비: 입장권 */
.lobby { position: relative; z-index: 1; grid-template-rows: auto auto; align-content: center; min-height: calc(100dvh - 175px); padding-top: 6px; }
.l-main { grid-template-columns: minmax(0, 1fr) 290px; gap: 26px; align-items: start; justify-content: stretch; }
.mcard.ticket { display: grid; grid-template-columns: minmax(0, 1fr) 212px; padding: 0; gap: 0; background: var(--sheet); color: var(--ink); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); transform: rotate(-.5deg); }
.tk-main { padding: 18px 26px 22px; display: grid; gap: 15px; min-width: 0; }
.tk-stub { border-left: 3px dashed var(--ink); background: var(--stub); padding: 18px 14px; display: grid; justify-items: center; align-content: space-between; gap: 14px; }
.tk-no { text-align: center; display: grid; }
.tk-no small { font-size: 13px; font-weight: 700; }
.tk-no b { font: 400 30px/1.2 var(--slab); }
.stamp { width: 158px; height: 158px; border-radius: 50%; border: 5px solid var(--red); outline: 2px solid var(--red); outline-offset: 5px; margin: 7px; background: var(--red); color: var(--sheet); font: 400 36px/1.12 var(--big); cursor: pointer; transform: rotate(-8deg); transition: transform .1s; }
.stamp:hover { transform: rotate(-8deg) scale(1.04); }
.stamp:active { transform: rotate(-8deg) scale(.92); }
.m-top { justify-content: space-between; color: var(--ink); font-size: 15px; font-weight: 700; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.m-top .w { color: var(--ink); }
.m-team b { font: 400 clamp(25px, 3vw, 34px)/1.1 var(--big); }
.m-team small { color: var(--ink); font-size: 14px; font-weight: 700; }
.m-mid { font: 400 clamp(36px, 5vw, 56px)/1 var(--big); color: var(--red); }
.m-stake { background: var(--ink); color: var(--sheet); padding: 9px 14px; }
.m-stake b { font: 400 22px/1.25 var(--big); color: var(--gold); }
.m-stake small { color: var(--sheet); font-size: 14px; }
.m-hint { color: var(--ink); font-size: 16px; }
.m-hint b { color: var(--red); font-weight: 900; }
.m-alert { background: var(--yellow); border: 2px solid var(--ink); color: var(--ink); font: 700 14px/1.3 var(--body); min-height: 44px; }
.m-title { color: var(--ink); }
.m-bracket .bracket > div { background: var(--stub); }
.m-bracket .bracket small { color: var(--muted); }
.l-side { gap: 16px; }
.l-box { background: var(--sheet); color: var(--ink); border: 2px solid var(--ink); padding: 12px 16px; }
.l-box small { color: var(--ink); font-size: 13px; font-weight: 700; }
.l-box > b { font: 400 28px/1.2 var(--big); }
.l-box > span:last-child { color: var(--ink); font-size: 14px; }
.cells { display: flex; gap: 3px; }
.cells i { flex: 1; height: 12px; border: 2px solid var(--green); }
.cells i.on { background: var(--green); }
.dots i { line-height: 26px; }
.dots i.W { background: var(--green); } .dots i.L { background: var(--red); } .dots i.D { background: #5A6878; }
.dots span { color: var(--ink); font-size: 15px; }
.ticker-l { background: var(--ink); color: var(--sheet); padding: 9px 14px; font-size: 15px; }
.ticker-l b { font: 400 17px/1 var(--big); color: var(--gold); margin-right: 10px; }

/* 경기 준비 */
.sheet-wrap { background: rgba(30, 42, 56, .72); padding: 72px 16px 76px; place-items: safe center; }
.sheet { background: var(--sheet); color: var(--ink); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); }
.sheet h2 { font: 400 28px/1.15 var(--big); color: var(--red); }
.sheet h3 { font: 700 14px/1.2 var(--body); color: var(--ink); border-top: 2px solid var(--ink); padding-top: 7px; margin-top: 7px; }
.close { color: var(--ink); }
.sheet-tip { color: var(--ink); font-size: 14px; }
.sheet-stake { color: var(--ink); font: 400 21px/1.3 var(--big); }
.tac { background: var(--page); border: 2px solid var(--ink); color: var(--ink); min-height: 44px; }
.tac b { font: 400 19px/1.2 var(--big); }
.tac span { color: var(--ink); font-size: 12px; }
.tac.on { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.tac.on b { color: var(--gold); }
.tac.on span { color: var(--sheet); }

/* 선수단: 옛날 선수 카드 */
.sq-head h2, .bench h3 { font: 400 23px/1.15 var(--big); color: var(--ink); }
.sq-meta { color: var(--ink); font-weight: 700; }
.sq-meta b { font: 400 21px/1 var(--slab); }
.board { background: none; border: 0; border-radius: 0; padding: 0; gap: 9px; overflow: visible; }
.board::before, .board::after { display: none; }
.b-row { gap: 12px; }
.pc { width: clamp(150px, 15.5vw, 196px); padding: 0; gap: 0; display: flex; flex-direction: column; text-align: left; background: var(--sheet); border: 2px solid var(--ink); border-radius: 0; box-shadow: none; }
.pc:hover { transform: translateY(-2px); }
.pc.gold, .pc.silver, .pc.bronze { background: var(--sheet); border-color: var(--ink); }
.pc.gold .pc-ov { color: var(--red); }
.pc.sel { outline: 0; background: var(--white); box-shadow: 5px 5px 0 var(--ink); transform: rotate(-1.2deg); }

<script>// 소리는 모두 직접 합성한다. 외부 음원 파일을 쓰지 않는다.

  // 부상 없는 선수로 포지션을 채울 수 없으면 무료 임시 선수를 데려온다.

  function buildEngineTeam(st, idx, tactic) {

  function aiTactic(st, team) {

  // ---------- 일정 ----------
  function roundRobin(st) {

  function emptyTable() {
    var t = [];

    return t;
  }
  function sorted(st) {

    });
  }
  function rankOf(st, idx) {
    var s = sorted(st);

    return 8;
  }
  function pickWeather(st) {

  }

  // ---------- 새 게임 ----------
  function newGame(seed) {
    var st = { v: 1, rng: seed >>> 0, nextId: 1, season: 1, round: 0, phase: 'choose', myTeam: -1, teams: [], pool: [], budget: 0, trust: 60, rep: 40, training: { focus: 'shoot', intensity: 1 }, myTactic: { attack: 'balanced', beater: 'chaser', seeker: 'direct' }, news: [], ledger: [], history: [], records: { titles: 0, bestRank: 9, seasons: 0 }, table: [], schedule: [], results: [], market: [], upcoming: null, playoff: null, goal: null, offseason: null, lastReport: null, transfersLeft: 0 };
    var levels = LEVELS.slice();
    for (var k = levels.length - 1; k > 0; k--) { var j = Math.floor(rnd(st) * (k + 1)), t = levels[k]; levels[k] = levels[j]; levels[j] = t; }
    for (var i = 0; i < TEAMS; i++) {
      var def = S.TEAM_DEFS[i];
      var team = {
        def: i, name: def.name, level: levels[i], chemistry: 60, morale: 60, players: genSquad(st, levels[i]), lineup: null, lastXI: [],
        style: pick(st, ['aggressive', 'balanced', 'balanced', 'defensive']), seekerStyle: pick(st, ['direct', 'direct', 'smart'])
      };
      team.lineup = autoLineup(team);
      st.teams.push(team);
    }
    st.names2 = true;
    assignNicks(st);
    for (var n = 0; n < 16; n++) st.pool.push(genPlayer(st, pick(st, ['chaser', 'chaser', 'chaser', 'beater', 'beater', 'keeper', 'seeker']), 42 + rnd(st) * 11, 18 + Math.floor(rnd(st) * 14), 0));
    return st;
  }
  function choosable(st) {
    return st.teams.map(function (t, i) { return i; }).sort(function (a, b) { return strength(st.teams[a]) - strength(st.teams[b]); }).slice(0, 3);
  }
  function chooseTeam(st, idx) {
    st.myTeam = idx;
    st.budget = 260;
    st.myTactic.attack = st.teams[idx].style;
    log(st, '시즌 시작 예산', 260);
    startSeason(st);
  }
  function setGoal(st) {
    var list = st.teams.map(function (t, i) { return { i: i, s: strength(t) }; }).sort(function (a, b) { return b.s - a.s; });
    var expected = list.map(function (x) { return x.i; }).indexOf(st.myTeam) + 1;
    var target = Math.max(1, expected - 1);
    st.goal = { target: target, expected: expected, text: target === 1 ? '플레이오프 우승' : target <= 4 ? '플레이오프 진출 (' + target + '위 이내 권장)' : target + '위 이내' };

  }
  function startSeason(st) {

    st.market = [];

  }
  function addNews(st, text) {
    st.news.unshift({ s: st.season, r: st.round + 1, text: text });
    if (st.news.length > 30) st.news.length = 30;
  }
  function log(st, label, amount) {
    st.ledger.unshift({ s: st.season, r: st.round + 1, label: label, amount: amount });
    if (st.ledger.length > 40) st.ledger.length = 40;
  }
  function transferOpen(st) { return st.phase === 'offseason' || (st.phase === 'regular' && st.round === 7); }

  // ---------- 이번 주 경기 ----------
  function userFixture(st) {
    if (st.phase === 'regular') return st.schedule[st.round].filter(function (m) { return m.h === st.myTeam || m.a === st.myTeam; })[0];
    if (st.phase === 'playoff') return st.playoff.matches.filter(function (m) { return !m.done && (m.h === st.myTeam || m.a === st.myTeam); })[0] || null;
    return null;
  }
  function prepareUpcoming(st) {
    var fx = userFixture(st);
    st.teams.forEach(function (t, i) { if (i !== st.myTeam) t.lineup = (ensureFit(st, t), autoLineup(t)); });
    var notes = [];
    ensureFit(st, my(st), notes);
    notes.forEach(function (n) { addNews(st, n); });
    repairLineup(my(st));
    if (!fx) { st.upcoming = null; if (st.phase === 'regular' || st.phase === 'playoff') openMidMarket(st); return; }
    var oppo = fx.h === st.myTeam ? fx.a : fx.h;
    st.upcoming = { h: fx.h, a: fx.a, oppo: oppo, seed: Math.floor(rnd(st) * 2147483647), weather: pickWeather(st), oppoTactic: aiTactic(st, st.teams[oppo]) };
    openMidMarket(st);
  }
  function openMidMarket(st) { if (transferOpen(st)) buildMarket(st); else st.market = []; }
  // 관전과 결과만 보기가 같은 경기를 내도록 입력을 한곳에서 만든다.
  function matchInput(st) {
    var u = st.upcoming, home = u.h === st.myTeam;

  }
  // 경기 직전 상태로 분석 입력을 만든다. 자동 선발이 지금과 다르면 비교 대상으로 넣는다.
  function analysisContext(st) {
    var input = matchInput(st), team = my(st), myside = st.upcoming.h === st.myTeam ? 0 : 1, auto = autoLineup(team);

  function simulate(input) { return S.simulateMatch(input.a, input.b, { seed: input.seed, weather: input.weather }); }

  function applyPlayerEffects(st, idx, m, side) {
    var team = st.teams[idx], report = [];
    var started = {};

      var p = team.players.filter(function (x) { return x.id === r.id; })[0];

      p.apps++; p.goals += r.goals; p.ratingSum += r.rating;
      p.fatigue = clamp(p.fatigue + PLAY_LOAD[p.pos] * (1.5 - p.stamina / 100), 0, 100);
      var hits = m.events.filter(function (e) { return e.type === 'bludger' && e.targetId === r.id; }).length;
      var risk = 0.008 + Math.max(0, p.fatigue - 60) * 0.0022 + hits * 0.012;
      if (rnd(st) < risk) {

  }
  function recordResult(st, h, a, m, stage) {

      else if (m.winner === 1) { B.w++; A.l++; B.pts += 3; A.form.push('L'); B.form.push('W'); }
      else { A.d++; B.d++; A.pts++; B.pts++; A.form.push('D'); B.form.push('D'); }

      if (B.form.length > 5) B.form.shift();

  }
  function simCpuMatch(st, h, a) {
    var ta = buildEngineTeam(st, h, aiTactic(st, st.teams[h])), tb = buildEngineTeam(st, a, aiTactic(st, st.teams[a]));
    var m = S.simulateMatch(ta, tb, { seed: Math.floor(rnd(st) * 2147483647), weather: pickWeather(st) });
    // 비기면 플레이오프에서 상위 시드가 올라간다.

  }

  // ---------- 주간 처리 ----------
  function trainTeam(st, team, focus, intensity) {
    var cfg = INTENSITY[intensity];
    team.players.forEach(function (p) {
      if (p.injury) return;
      var r = (p.age <= 20 ? 0.9 : p.age <= 23 ? 0.65 : p.age <= 26 ? 0.3 : p.age <= 29 ? 0.12 : 0.04) * cfg.grow;
      if (ov(p) < p.pot) {
        p.xp += r;
        while (p.xp >= 1) {
          p.xp -= 1;
          var w = WEIGHT[p.pos], key = focus;
          if (!w[focus] || rnd(st) > 0.7) {
            var roll = rnd(st), acc = 0;
            ATTRS.some(function (k) { acc += w[k]; if (roll <= acc) { key = k; return true; } return false; });
          }
          if (w[key]) p[key] = Math.min(99, p[key] + 1);
        }

  }
  function weekly(st) {
    var mine = my(st), xi = mine.lastXI;
    st.teams.forEach(function (t, i) {
      var train = i === st.myTeam ? st.training : { focus: pick(st, ATTRS), intensity: 1 };
      trainTeam(st, t, train.focus, train.intensity);
      t.players.forEach(function (p) {
        p.fatigue = clamp(p.fatigue - (t.lastXI.indexOf(p.id) >= 0 ? 24 : 38), 0, 100);
        if (p.injury > 0) p.injury--;
      });
    });
    var wages = mine.players.reduce(function (s, p) { return s + wage(p); }, 0);

  function income(st, isHome, won) {

    if (isHome) { var gate = Math.round(14 + st.rep * 0.42); st.budget += gate; log(st, '입장 수입', gate); }
    if (won) { st.budget += 8; log(st, '승리 수당', 8); }
  }

  // 사용자 경기 결과를 반영하고 나머지 경기와 한 주를 처리한다.
  function finishMatch(st, m) {
    var u = st.upcoming, h = u.h, a = u.a, myside = h === st.myTeam ? 0 : 1;
    var before = rankOf(st, st.myTeam);
    var report = { h: h, a: a, score: m.score, winner: m.winner, myside: myside, ratings: m.ratings, injuries: [], weather: m.weather, duration: m.duration, snitchBy: m.snitchBy, stage: st.phase, round: st.round, season: st.season, playoffStage: st.playoff ? st.playoff.stage : null };
    var inj = applyPlayerEffects(st, h, m, 0).concat(applyPlayerEffects(st, a, m, 1));
    report.injuries = inj.filter(function (x) { return my(st).players.some(function (p) { return x.indexOf(p.name + ' ') === 0; }); });
    var won = m.winner === myside;
    var budget0 = st.budget, snap = growthSnapshot(st);
    if (st.phase === 'regular') {
      recordResult(st, h, a, m, 'regular');
      st.schedule[st.round].forEach(function (g) {
        if (g.h === st.myTeam || g.a === st.myTeam) return;
        var cm = simCpuMatch(st, g.h, g.a);
        recordResult(st, g.h, g.a, cm, 'regular');
      });
      income(st, h === st.myTeam, won);
      weekly(st);
      report.rankBefore = before; report.rankAfter = rankOf(st, st.myTeam);
      report.money = st.budget - budget0;
      report.growth = growthDiff(st, snap);
      addNews(st, (S.TEAM_DEFS[st.teams[h].def].name) + ' ' + m.score[0] + ':' + m.score[1] + ' ' + S.TEAM_DEFS[st.teams[a].def].name);
      inj.forEach(function (x) { if (report.injuries.indexOf(x) >= 0) addNews(st, x); });
      st.lastReport = compactReport(report);
      st.round++;
      if (st.round >= ROUNDS) startPlayoff(st); else prepareUpcoming(st);
    } else {
      var match = userFixture(st);
      match.done = true; match.sh = m.score[0]; match.sa = m.score[1];
      match.win = m.winner === null ? match.h : (m.winner === 0 ? match.h : match.a);
      recordResult(st, h, a, m, st.playoff.stage);
      income(st, true, won);
      if (won) { st.budget += 20; log(st, '플레이오프 승리 수당', 20); }
      report.money = st.budget - budget0;
      st.lastReport = compactReport(report);
      finishPlayoffRound(st);
    }
    return st.lastReport;
  }
  function compactReport(r) {
    r.growth = r.growth || [];
    r.ratings = r.ratings.map(function (x) { return { id: x.id, name: x.name, side: x.side, posName: x.posName, rating: x.rating, goals: x.goals, assists: x.assists, saves: x.saves, hits: x.hits, catches: x.catches, tackles: x.tackles }; });
    return r;
  }

  // ---------- 플레이오프 ----------
  function startPlayoff(st) {
    var s = sorted(st);
    st.phase = 'playoff';
    st.seeds = s.map(function (x) { return x.team; });
    st.playoff = { stage: 'semi', matches: [{ h: s[0].team, a: s[3].team }, { h: s[1].team, a: s[2].team }], champion: null, log: [] };
    addNews(st, '정규 리그 종료. 플레이오프 진출: ' + s.slice(0, 4).map(function (x) { return st.teams[x.team].name; }).join(', '));
    prepareUpcoming(st);
    if (!st.upcoming) simRemainingCpu(st);
  }
  function simRemainingCpu(st) {
    st.playoff.matches.forEach(function (g) {
      if (g.done || g.h === st.myTeam || g.a === st.myTeam) return;
      var m = simCpuMatch(st, g.h, g.a);
      g.done = true; g.sh = m.score[0]; g.sa = m.score[1];
      g.win = m.winner === null ? g.h : (m.winner === 0 ? g.h : g.a);
      recordResult(st, g.h, g.a, m, st.playoff.stage);
    });
  }
  function finishPlayoffRound(st) {
    simRemainingCpu(st);
    var po = st.playoff;
    po.log = po.log.concat(po.matches.map(function (g) { return { stage: po.stage, h: g.h, a: g.a, sh: g.sh, sa: g.sa, win: g.win }; }));
    if (po.stage === 'semi') {
      var wins = po.matches.map(function (g) { return g.win; });
      po.stage = 'final';
      po.matches = [{ h: wins[0], a: wins[1] }];
      st.teams.forEach(function (t) { t.players.forEach(function (p) { p.fatigue = clamp(p.fatigue - 20, 0, 100); if (p.injury > 0) p.injury--; }); });

      if (!st.upcoming) st.waitFinal = true;
